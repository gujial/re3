name: Nintendo Switch CMake Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-nintendo-switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure and build
        run: |
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREVC_AUDIO=OAL -DLIBRW_PLATFORM=GL3 -DLIBRW_GL3_GFXLIB=GLFW -DREVC_WITH_OPUS=OFF -DREVC_VENDORED_LIBRW=ON -DREVC_INSTALL=ON
          cmake --build build --parallel
      - name: Package
        working-directory: build
        run: cpack
      - uses: actions/upload-artifact@v4
        with:
          name: reVC-Improved-switch-gl3-Release
          path: build/*.tar.xz
          if-no-files-found: error
          retention-days: 14

  upload-release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-nintendo-switch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reVC-Improved-switch-gl3-Release
          path: release-assets
      - name: Wait for draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          attempt=0
          until gh release view "$TAG_NAME" >/dev/null 2>&1 || [ "$attempt" -ge 60 ]; do
            sleep 5
            attempt=$((attempt + 1))
          done
          gh release view "$TAG_NAME" >/dev/null
      - name: Upload Switch package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" release-assets/*.tar.xz --clobber
