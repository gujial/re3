name: Nintendo Switch CMake Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-nintendo-switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure and build
        run: |
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREVC_AUDIO=OAL -DLIBRW_PLATFORM=GL3 -DLIBRW_GL3_GFXLIB=GLFW -DREVC_WITH_OPUS=OFF -DREVC_VENDORED_LIBRW=ON -DREVC_INSTALL=ON
          cmake --build build --parallel
      - name: Package
        working-directory: build
        run: cpack
      - uses: actions/upload-artifact@v4
        with:
          name: reVC-Improved-switch-gl3-Release
          path: build/*.tar.xz
          if-no-files-found: error
          retention-days: 14
