name: Nix Flake Build

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [miami-improve]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Nix ${{ matrix.target.system }} ${{ matrix.variant }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '[{"system":"x86_64-linux","runner":"ubuntu-24.04"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","runner":"macos-15"}]' || '[{"system":"x86_64-linux","runner":"ubuntu-24.04"}]') }}
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["Release","Debug"]' || '["Release"]') }}
    steps:
      # Nix obtains dependencies from flake.lock, not the local submodules.
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v14
        with:
          name: re3
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: Check flake evaluation
        if: matrix.target.system == 'x86_64-linux' && matrix.variant == 'Release'
        run: nix flake check --no-build --no-update-lock-file
      - name: Build
        env:
          SYSTEM: ${{ matrix.target.system }}
          VARIANT: ${{ matrix.variant }}
        run: |
          package=reVC-Improved
          if [ "$VARIANT" = Debug ]; then package=reVC-Improved-debug; fi
          nix build ".#packages.$SYSTEM.$package" --out-link result-ci --no-update-lock-file -L
      - name: Package
        run: |
          mkdir package
          cp result-ci/bin/reVC-Improved package/
          cp -r result-ci/share/reVC-Improved/. package/
          tar -czf "reVC-Improved-${{ matrix.target.system }}-${{ matrix.variant }}.tar.gz" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: reVC-Improved-${{ matrix.target.system }}-${{ matrix.variant }}
          path: |
            package/
            reVC-Improved-${{ matrix.target.system }}-${{ matrix.variant }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  upload-release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reVC-Improved-*-Release
          path: release-assets
      - name: Wait for draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          attempt=0
          until gh release view "$TAG_NAME" >/dev/null 2>&1 || [ "$attempt" -ge 60 ]; do
            sleep 5
            attempt=$((attempt + 1))
          done
          gh release view "$TAG_NAME" >/dev/null
      - name: Upload Nix packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          while IFS= read -r -d '' asset; do
            gh release upload "$TAG_NAME" "$asset" --clobber
          done < <(find release-assets -type f -name '*.tar.gz' -print0)
